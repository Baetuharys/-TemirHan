name: validate
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_all.py
      - run: python -m compileall -q engineering_core rag tools engines scripts training

  image-cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r engines/image_to_cad/requirements.txt
      - run: python engines/image_to_cad/tests/test_synthetic.py
